[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "story-slicer"
version = "0.1.0"
description = "Strict story-slicing domain contracts and hexagonal ports"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
    "httpx>=0.28,<1",
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[dependency-groups]
dev = ["mypy>=1.19,<2", "pytest>=8,<10", "ruff>=0.14,<1", "types-PyYAML>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/story_slicer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
