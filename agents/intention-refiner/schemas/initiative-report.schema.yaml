$schema: https://json-schema.org/draft/2020-12/schema
title: Initiative Report
description: >-
  Structured requirements refinement report produced by intention-refiner. Initiative
  fields must have distinct purposes and must not repeat sentences or paragraphs.
  Each KPI target must appear in one place only across initiative content, suggestions,
  and suggestions. Ambiguities are converted to CLARIFICATION questions and
  therefore do not remain in the serialized audit. These semantic constraints are
  enforced during report refinement because JSON Schema cannot detect paraphrase overlap.
type: object
additionalProperties: false
required:
  - initiative
  - suggestions
  - audit
  - metadata
properties:
  initiative:
    description: >-
      Extracted initiative content. Keep problem, audience, value, scope, exclusions,
      metrics, and outcomes in their corresponding fields without repeated prose.
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - problem_statement
      - target
      - business_value
      - business_scope
      - ex_scope
      - kpi
      - desired_outcomes
    properties:
      id: {type: [string, 'null']}
      title: {type: [string, 'null']}
      problem_statement: {type: [string, 'null']}
      target:
        type: [string, 'null']
        description: Intended users or audience; do not repeat the problem statement.
      business_value:
        type: [string, 'null']
        description: Business rationale or value; do not restate desired outcomes.
      business_scope:
        type: [string, 'null']
        description: Work and capabilities included in the initiative.
      ex_scope:
        type: [string, 'null']
        description: Explicitly excluded work.
      kpi:
        type: [string, 'null']
        description: KPI definitions and targets; do not duplicate them in suggestions.
      desired_outcomes:
        type: [string, 'null']
        description: Intended results, without repeating business value or KPI targets.
  suggestions:
    description: >-
      Human review items. CLARIFICATION items must be direct, actionable questions.
      Do not repeat KPI targets already present in initiative content.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [field_name, tag, text]
      properties:
        field_name:
          $ref: '#/$defs/requirementField'
        tag:
          type: string
          enum: [AI_ENHANCED, FEATURE_IDEA, CLARIFICATION]
        text:
          type: string
          minLength: 1
      allOf:
        - if:
            properties:
              tag: {const: CLARIFICATION}
            required: [tag]
          then:
            properties:
              text:
                pattern: '(\?|؟)$'
                description: A direct, actionable question ending with question punctuation.
  audit:
    description: >-
      Remaining audit findings. Ambiguities are converted to CLARIFICATION suggestions
      before serialization, so this array must be empty in a refined report.
    type: object
    additionalProperties: false
    required: [ambiguities, missing_information, other_risks]
    properties:
      ambiguities:
        type: array
        maxItems: 0
        items: {type: string}
      missing_information:
        type: array
        maxItems: 0
        items: {type: string}
      other_risks:
        type: array
        items: {type: string}
  metadata:
    type: object
    additionalProperties: false
    required: [provider, model, response_time_ms]
    properties:
      source:
        type: object
        additionalProperties: false
        required: [provider, identifier, url]
        properties:
          provider: {type: string, enum: [github, jira]}
          identifier: {type: string, minLength: 1}
          url: {type: string, minLength: 1}
      provider:
        type: string
      model:
        type: string
      response_time_ms:
        type: number
        minimum: 0
$defs:
  requirementField:
    type: string
    enum:
      - id
      - title
      - problem_statement
      - target
      - business_value
      - business_scope
      - ex_scope
      - kpi
      - desired_outcomes
